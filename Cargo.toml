[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-pkg",
    "crates/aether-runtime",
    "crates/aether-mcpd",
    "crates/aether-cli",
    "crates/aether-shell",
    "crates/aether-ai-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AetherOS Core Team <core@aetheros.org>"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "=1.35.1", features = ["full"] }
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"
clap = { version = "=4.4.18", features = ["derive"] }
clap_lex = "=0.7.0"
clap_builder = "=4.4.18"
anyhow = "=1.0.79"
thiserror = "=1.0.56"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
async-trait = "=0.1.77"
futures = "=0.3.30"
colored = "=2.1.0"
mio = "=0.8.10"
libc = "=0.2.153"
log = "=0.4.20"
