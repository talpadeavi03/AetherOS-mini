# ==============================================================================
# AetherOS Central System Configuration
# ==============================================================================

[general]
os_name = "AetherOS"
version = "2026.1-alpha"
edition = "Universal AI Native"
telemetry = true

[runtimes]
linux_native = true
waydroid_android = true
dotnet_coreclr = true
windows_wine_proton = true
oci_containers = true
kubernetes_k3s = true

[ai]
default_model = "llama-3.2-1b"
mcp_socket = "/run/aether/mcp.sock"
local_inference_endpoint = "http://127.0.0.1:11434"
auto_quantize = true

[shell]
compositor = "hyprland"
ai_panel_hotkey = "Super+Space"
hud_port = 7070
theme = "cyber-cyan"
