# -----------------------------------------------------
# AetherOS Desktop - Powered by Hyprdots & Kernel MCP
# -----------------------------------------------------

$scrPath = $HOME/.local/share/bin

# Monitor setup
monitor = ,preferred,auto,1

# VM Compatibility and Wayland Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = PATH,$PATH:$HOME/.local/share/bin

# Autostart Desktop Services
exec-once = waybar
exec-once = swaybg -i /usr/share/backgrounds/aetheros/hyprdots_wallpaper.jpg -m fill
exec-once = dunst
exec-once = kitty -T "Aether AI Copilot" -e bash -c "/usr/bin/aetherctl status; exec bash"

# Input Configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0
}

# Unified Gestures (Hyprland 0.56+)
gestures {
    gesture = 3, horizontal, workspace
}

# Layouts
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Sourced Configurations
source = ./themes/theme.conf
source = ./animations.conf
source = ./keybindings.conf
source = ./windowrules.conf
