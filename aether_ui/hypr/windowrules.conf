# Hyprland Window and Layer Rules (AetherOS Hyprdots Style - Hyprland 0.56+)

# Opacity Rules
windowrule = opacity 0.90 0.90, match:class ^(firefox)$
windowrule = opacity 0.90 0.90, match:class ^(Google-chrome)$
windowrule = opacity 0.90 0.90, match:class ^(Brave-browser)$
windowrule = opacity 0.85 0.85, match:class ^(code-oss)$
windowrule = opacity 0.85 0.85, match:class ^([Cc]ode)$
windowrule = opacity 0.85 0.85, match:class ^(kitty)$
windowrule = opacity 0.88 0.88, match:class ^(foot)$
windowrule = opacity 0.85 0.85, match:class ^(org.kde.dolphin)$
windowrule = opacity 0.85 0.85, match:class ^(org.kde.ark)$
windowrule = opacity 0.85 0.85, match:class ^(nwg-look)$
windowrule = opacity 0.85 0.85, match:class ^(qt5ct)$
windowrule = opacity 0.85 0.85, match:class ^(qt6ct)$
windowrule = opacity 0.85 0.85, match:class ^(kvantummanager)$
windowrule = opacity 0.85 0.75, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.85 0.75, match:class ^(blueman-manager)$
windowrule = opacity 0.85 0.75, match:class ^(nm-applet)$
windowrule = opacity 0.85 0.75, match:class ^(nm-connection-editor)$

# Floating Rules
windowrule = float 1, match:title ^(AetherOS Neural HUD)$
windowrule = size 960 640, match:title ^(AetherOS Neural HUD)$
windowrule = center 1, match:title ^(AetherOS Neural HUD)$
windowrule = opacity 0.95 0.90, match:title ^(AetherOS Neural HUD)$

windowrule = float 1, match:title ^(Aether AI Copilot)$
windowrule = size 760 500, match:title ^(Aether AI Copilot)$
windowrule = center 1, match:title ^(Aether AI Copilot)$

windowrule = float 1, match:title ^(Aether Sensory Telemetry)$
windowrule = size 760 500, match:title ^(Aether Sensory Telemetry)$
windowrule = center 1, match:title ^(Aether Sensory Telemetry)$

windowrule = float 1, match:title ^(Aether Vector Memory)$
windowrule = size 760 500, match:title ^(Aether Vector Memory)$
windowrule = center 1, match:title ^(Aether Vector Memory)$

windowrule = float 1, match:class ^(org.kde.dolphin)$, match:title ^(Progress Dialog — Dolphin)$
windowrule = float 1, match:class ^(org.kde.dolphin)$, match:title ^(Copying — Dolphin)$
windowrule = float 1, match:title ^(About Mozilla Firefox)$
windowrule = float 1, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float 1, match:class ^(firefox)$, match:title ^(Library)$
windowrule = float 1, match:class ^(kitty)$, match:title ^(top)$
windowrule = float 1, match:class ^(kitty)$, match:title ^(btop)$
windowrule = float 1, match:class ^(kitty)$, match:title ^(htop)$
windowrule = float 1, match:class ^(foot)$, match:title ^(htop)$
windowrule = float 1, match:class ^(vlc)$
windowrule = float 1, match:class ^(kvantummanager)$
windowrule = float 1, match:class ^(qt5ct)$
windowrule = float 1, match:class ^(qt6ct)$
windowrule = float 1, match:class ^(nwg-look)$
windowrule = float 1, match:class ^(org.kde.ark)$
windowrule = float 1, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(nm-applet)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, match:class ^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = float 1, match:class ^(org.freedesktop.impl.portal.desktop.hyprland)$

# Common Dialogs
windowrule = float 1, match:title ^(Open)$
windowrule = float 1, match:title ^(Choose Files)$
windowrule = float 1, match:title ^(Save As)$
windowrule = float 1, match:title ^(Confirm to replace files)$
windowrule = float 1, match:title ^(File Operation Progress)$

# Layer Rules
layerrule = blur 1, match:namespace waybar
layerrule = blur 1, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi
layerrule = blur 1, match:namespace dunst
layerrule = ignore_alpha 0.5, match:namespace dunst
layerrule = blur 1, match:namespace logout_dialog
