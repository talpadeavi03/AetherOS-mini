# AetherOS Hyprland Configuration (macOS / iOS Clean Aesthetic)

# Monitor configuration
monitor=,preferred,auto,1

# Environment variables for Wayland and VM compatibility
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# Autostart essential services
exec-once = waybar
exec-once = foot -T "Aether AI Copilot" -e /usr/bin/aetherctl

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# General appearance (Clean macOS-inspired layout)
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(0ea5e9ee) rgba(a855f7ee) 45deg
    col.inactive_border = rgba(303648aa)
    layout = dwindle
    allow_tearing = false
}

# Frosted Glass Aesthetics (Translucency, Rounding, Soft Shadows)
decoration {
    rounding = 12

    active_opacity = 0.94
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000060)
    }
}

# Fluid iOS / macOS Animation Curves
animations {
    enabled = true
    bezier = smoothOut, 0.16, 1, 0.3, 1
    bezier = fluidSpring, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, fluidSpring
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, smoothOut, slide
}

# Layout options
dwindle {
    pseudotile = true
    preserve_split = true
}

# Window Rules
windowrulev2 = float, title:^(Aether AI Copilot)$
windowrulev2 = size 720 480, title:^(Aether AI Copilot)$
windowrulev2 = center, title:^(Aether AI Copilot)$

# Keybindings
$mainMod = SUPER

# Application Launchers
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod, A, exec, foot -T "Aether AI Copilot" -e /usr/bin/aetherctl chat "diagnose system"
bind = $mainMod, C, exec, foot -e /usr/bin/aetherctl compact
bind = $mainMod, T, exec, foot -e /usr/bin/aetherctl threads

# Window Controls
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Move/Resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
